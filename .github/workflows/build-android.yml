
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build THE FORGOTTEN REALM APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y blender unzip

      - name: Prepare asset folders
        run: |
          mkdir -p public/assets/converted
          mkdir -p /tmp/tfr-assets

      - name: Extract 3D asset archives
        run: |
          if [ -f public/assets/craftpix-891176-free-environment-props-3d-low-poly-models.zip ]; then
            unzip -oq public/assets/craftpix-891176-free-environment-props-3d-low-poly-models.zip -d /tmp/tfr-assets/craftpix
          elif [ -f craftpix-891176-free-environment-props-3d-low-poly-models.zip ]; then
            unzip -oq craftpix-891176-free-environment-props-3d-low-poly-models.zip -d /tmp/tfr-assets/craftpix
          else
            echo "Craftpix archive not found. Skipping."
          fi

          if [ -f open-world-dark-fantasy-obj.zip ]; then
            unzip -oq open-world-dark-fantasy-obj.zip -d /tmp/tfr-assets/world
          else
            echo "World OBJ archive not found. Skipping."
          fi

      - name: Create Blender conversion script
        run: |
          cat > /tmp/convert-assets.py <<'PY'
          import bpy
          import sys
          from pathlib import Path

          args = sys.argv[sys.argv.index("--") + 1:]
          source = Path(args[0])
          output = Path(args[1])
          output.mkdir(parents=True, exist_ok=True)

          supported = {".fbx", ".obj"}
          files = [p for p in source.rglob("*") if p.suffix.lower() in supported]

          print(f"Found {len(files)} 3D files")

          converted = 0
          failed = 0

          for file in files:
              try:
                  bpy.ops.wm.read_factory_settings(use_empty=True)

                  if file.suffix.lower() == ".fbx":
                      bpy.ops.import_scene.fbx(filepath=str(file))
                  elif hasattr(bpy.ops.wm, "obj_import"):
                      bpy.ops.wm.obj_import(filepath=str(file))
                  else:
                      bpy.ops.import_scene.obj(filepath=str(file))

                  relative = file.relative_to(source).with_suffix(".glb")
                  destination = output / relative
                  destination.parent.mkdir(parents=True, exist_ok=True)

                  bpy.ops.export_scene.gltf(
                      filepath=str(destination),
                      export_format="GLB",
                      export_image_format="AUTO"
                  )

                  if destination.exists() and destination.stat().st_size > 0:
                      converted += 1
                      print(f"Converted: {file.name}")
                  else:
                      failed += 1
                      print(f"Export failed: {file.name}")

              except Exception as error:
                  failed += 1
                  print(f"Failed: {file}: {error}")

          print(f"Conversion complete: {converted} successful, {failed} failed")

          if files and converted == 0:
              raise RuntimeError("No 3D assets could be converted")
          PY

      - name: Convert 3D assets to GLB
        run: |
          if [ -d /tmp/tfr-assets/craftpix ]; then
            blender --background --python /tmp/convert-assets.py -- \
              /tmp/tfr-assets/craftpix public/assets/converted/craftpix
          fi

          if [ -d /tmp/tfr-assets/world ]; then
            blender --background --python /tmp/convert-assets.py -- \
              /tmp/tfr-assets/world public/assets/converted/world
          fi

      - name: Install project dependencies
        run: npm install

      - name: Build web game
        run: npm run build

      - name: Set up Capacitor Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: the-forgotten-realm-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
