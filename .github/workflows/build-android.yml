name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender

      - name: Extract and convert Craftpix props
        run: |
          mkdir -p /tmp/craftpix
          mkdir -p public/assets/props

          unzip -o public/assets/craftpix-891176-free-environment-props-3d-low-poly-models.zip -d /tmp/craftpix

          cat > /tmp/convert-craftpix.py <<'PY'
          import bpy
          import os

          source = "/tmp/craftpix/FBX"
          texture_dir = "/tmp/craftpix/Texture"
          output = "public/assets/props"

          os.makedirs(output, exist_ok=True)

          for name in sorted(os.listdir(source)):
              if not name.lower().endswith(".fbx"):
                  continue

              bpy.ops.wm.read_factory_settings(use_empty=True)

              path = os.path.join(source, name)

              bpy.ops.import_scene.fbx(
                  filepath=path
              )

              for img in bpy.data.images:
                  if img.source != 'FILE':
                      continue

                  if not os.path.exists(bpy.path.abspath(img.filepath)):
                      filename = os.path.basename(img.filepath)
                      blender = os.path.join(texture_dir, filename)

                      if os.path.exists(candidate):
                          img.filepath = candidate
                          img.reload()

              bpy.ops.file.pack_all()

              target = os.path.join(
                  output,
                  os.path.splitext(name)[0] + ".glb"
              )

              bpy.ops.export_scene.gltf(
                  filepath=target,
                  export_format="GLB",
                  export_materials="EXPORT"
              )

              print("CONVERTED:", name)

          print("CRAFTPIX CONVERSION COMPLETE")
          PY

         blender --background --python-exit-code 1 --python /tmp/convert-craftpix.py

      - name: Extract 3D world assets
        run: |
          mkdir -p public/assets/world
          unzip -o open-world-dark-fantasy-obj.zip -d public/assets/world      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - name: Convert 3D world to GLB
        run: |
          npx --yes obj2gltf@3.2.0 \
            -i public/assets/world/open-world-dark-fantasy.obj \
            -o public/assets/world/open-world-dark-fantasy.glb \
            -b
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: the-forgotten-realm-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
