
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build THE FORGOTTEN REALM APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy unzip
          blender --background --python-expr "import bpy, numpy; print('Blender:', bpy.app.version_string, '| NumPy:', numpy.__version__)"

      - name: Prepare asset folders
        run: |
          mkdir -p public/assets/converted/craftpix public/assets/world
          mkdir -p /tmp/tfr-assets

      - name: Extract 3D asset archives
        run: |
          set -euo pipefail
          CRAFTPIX_ZIP="craftpix-891176-free-environment-props-3d-low-poly-models.zip"
          WORLD_ZIP="open-world-dark-fantasy-obj.zip"
          test -f "$CRAFTPIX_ZIP" || { echo "::error::Missing $CRAFTPIX_ZIP"; exit 1; }
          test -f "$WORLD_ZIP" || { echo "::error::Missing $WORLD_ZIP"; exit 1; }
          unzip -oq "$CRAFTPIX_ZIP" -d /tmp/tfr-assets/craftpix
          unzip -oq "$WORLD_ZIP" -d /tmp/tfr-assets/world
          test "$(find /tmp/tfr-assets/craftpix -type f -iname '*.fbx' | wc -l)" -eq 28 || { echo "::error::Expected 28 Craftpix FBX files"; exit 1; }
          test -f /tmp/tfr-assets/world/open-world-dark-fantasy.obj || { echo "::error::World OBJ missing from archive"; exit 1; }

      - name: Create Blender conversion script
        run: |
          cat > /tmp/convert-assets.py <<'PY'
          import bpy
          import sys
          from pathlib import Path

          args = sys.argv[sys.argv.index("--") + 1:]
          source = Path(args[0])
          output = Path(args[1])
          output.mkdir(parents=True, exist_ok=True)

          files = sorted(p for p in source.rglob("*") if p.suffix.lower() == ".fbx")

          print(f"Found {len(files)} 3D files")

          converted = 0
          failed = 0

          for file in files:
              try:
                  bpy.ops.wm.read_factory_settings(use_empty=True)

                  if file.suffix.lower() == ".fbx":
                      bpy.ops.wm.fbx_import(filepath=str(file))
                  relative = file.relative_to(source).with_suffix(".glb")
                  destination = output / relative
                  destination.parent.mkdir(parents=True, exist_ok=True)

                  bpy.ops.export_scene.gltf(
                      filepath=str(destination),
                      export_format="GLB",
                      export_image_format="AUTO"
                  )

                  if destination.exists() and destination.stat().st_size > 0:
                      converted += 1
                      print(f"Converted: {file.name}")
                  else:
                      raise RuntimeError(f"GLB export is missing or empty: {destination}")

              except Exception as error:
                  failed += 1
                  print(f"Failed: {file}: {error}")

          print(f"Conversion complete: {converted} successful, {failed} failed")

          if failed or converted != len(files) or len(files) != 28:
              raise RuntimeError(f"Expected 28 successful FBX conversions, got {converted}; failed={failed}")
          PY

      - name: Convert 3D assets to GLB
        run: |
          set -euo pipefail
          blender --background --python-exit-code 1 --python /tmp/convert-assets.py -- \
            /tmp/tfr-assets/craftpix/FBX public/assets/converted/craftpix
          npx --yes obj2gltf@3.2.0 \
            -i /tmp/tfr-assets/world/open-world-dark-fantasy.obj \
            -o public/assets/world/open-world-dark-fantasy.glb \
            -b
          test -s public/assets/world/open-world-dark-fantasy.glb || { echo "::error::Converted world GLB is missing or empty"; exit 1; }
          echo "Converted Craftpix GLB files: $(find public/assets/converted/craftpix -type f -iname '*.glb' | wc -l)"
          test "$(find public/assets/converted/craftpix -type f -iname '*.glb' | wc -l)" -eq 28
          ls -lh public/assets/world/open-world-dark-fantasy.glb

      - name: Install project dependencies
        run: npm ci

      - name: Build web game
        run: npm run build

      - name: Set up Capacitor Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android APKs
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: the-forgotten-realm-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: the-forgotten-realm-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
