<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>THE FORGOTTEN PATH — Scenic 2D</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#12202b;touch-action:none}canvas{display:block;width:100%;height:100%}
#brand{position:fixed;top:14px;left:16px;color:#fff;text-shadow:0 2px 7px #15202a;letter-spacing:.13em;font-weight:700;font-size:clamp(14px,2.4vw,22px)}
#subtitle{position:fixed;top:45px;left:16px;color:#f0f5e8;text-shadow:0 2px 5px #20303a;font-size:12px}
#place{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:#fff8d8;text-align:center;text-shadow:0 2px 5px #18222a;font-size:14px}
#place small{display:block;color:#e7eee0;font-size:11px;margin-top:3px}
#controls{position:fixed;bottom:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.group{display:flex;gap:10px;pointer-events:auto}button{width:66px;height:60px;border:1px solid #ffffff80;border-radius:17px;background:#15232c88;color:white;font-size:24px;backdrop-filter:blur(5px);touch-action:none}#slow,#time{width:76px;font-size:13px}
#discover{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);padding:10px 16px;background:#17272bbd;border:1px solid #fff5c766;border-radius:14px;color:#fff8dc;text-align:center;opacity:0;transition:opacity .35s;pointer-events:none;max-width:90vw}
#discover.show{opacity:1}#progress{position:fixed;top:0;left:0;height:3px;background:#fff2bf;width:0}
#journalBtn{position:fixed;top:14px;right:14px;width:auto;height:42px;padding:0 14px;font-size:13px;border-radius:13px}
#journal{display:none;position:fixed;inset:0;background:#101b25d9;backdrop-filter:blur(8px);z-index:5;align-items:center;justify-content:center;padding:18px}
#journal.open{display:flex}#journalCard{width:min(560px,100%);max-height:85vh;overflow:auto;background:#1b2b34;border:1px solid #ffffff55;border-radius:22px;padding:20px;color:#f4f1df;box-shadow:0 18px 60px #0008}
#journalCard h2{margin:0 0 8px;font-size:22px}#journalCard p{color:#c9d8d4;font-size:13px}#journalClose{float:right;width:38px;height:38px;font-size:18px}#mapTrack{height:14px;background:#42545a;border-radius:20px;position:relative;margin:18px 0 8px;overflow:visible}#mapFill{height:100%;width:0;background:#d6c99a;border-radius:20px}#mapMarks{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center}#mapMarks i{width:10px;height:10px;border-radius:50%;background:#7d9690;border:2px solid #1b2b34}#mapMarks i.found{background:#fff0b2}#journalList{display:grid;gap:9px;margin:14px 0} .entry{padding:11px 12px;border-radius:12px;background:#ffffff0d;border:1px solid #ffffff16}.entry strong{font-size:14px}.entry small{display:block;color:#bdcec7;margin-top:4px}.entry.locked{opacity:.55}#saveStatus{font-size:11px;color:#a9c6b4}
#photoBtn{position:fixed;top:62px;right:14px;width:auto;height:40px;padding:0 13px;font-size:13px;border-radius:13px}#photoPanel{display:none;position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:7;gap:9px;align-items:center;background:#14232dcc;border:1px solid #ffffff66;border-radius:16px;padding:8px;backdrop-filter:blur(7px)}#photoPanel.open{display:flex}#photoPanel button{width:auto;height:42px;padding:0 14px;font-size:13px;border-radius:12px}body.photo-mode #brand,body.photo-mode #subtitle,body.photo-mode #place,body.photo-mode #progress,body.photo-mode #discover,body.photo-mode #controls,body.photo-mode #journalBtn,body.photo-mode #photoBtn{display:none}
</style>
</head>
<body>
<canvas id="game" aria-label="Peaceful 2D exploration landscape"></canvas>
<div id="brand">THE FORGOTTEN PATH</div>
<div id="subtitle">A quiet journey through beautiful places</div>
<div id="place">WHISPERING VALLEY<small>Walk • Explore • Take in the view</small></div>
<div id="progress"></div><div id="discover"></div>
<button id="journalBtn">แผนที่ & บันทึก</button>
<button id="photoBtn">ถ่ายภาพวิว</button><div id="photoPanel"><button id="capturePhoto">บันทึกภาพ PNG</button><button id="exitPhoto">ออกจากโหมดภาพ</button></div>
<div id="journal" aria-modal="true" role="dialog"><div id="journalCard"><button id="journalClose" aria-label="ปิด">×</button><h2>บันทึกการเดินทาง</h2><p>เส้นทางเงียบสงบที่คุณค่อย ๆ ค้นพบ</p><div id="mapTrack"><div id="mapFill"></div><div id="mapMarks"></div></div><small id="mapText">เส้นทาง 0%</small><div id="journalList"></div><div id="saveStatus">บันทึกอัตโนมัติในอุปกรณ์นี้</div></div></div>
<div id="controls"><div class="group"><button id="left" aria-label="Walk left">◀</button><button id="right" aria-label="Walk right">▶</button></div><div class="group"><button id="slow">เดินช้า</button><button id="time">เวลา: ออโต้</button></div></div>
<script>
(()=>{const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');let w=innerWidth,h=innerHeight,dpr=1,saved={};try{saved=JSON.parse(localStorage.getItem('forgottenPathSave')||'{}')}catch(e){}let world=Math.max(0,Math.min(6200,Number(saved.world)||0)),slow=false,timeMode=Number(saved.timeMode)||0,time=Number(saved.time)||0.28,last=performance.now(),saveClock=0;const maxWorld=6200,keys={left:false,right:false};const points=[{x:850,n:'Whispering Forest',d:'A gentle path beneath the old trees.'},{x:1900,n:'Silent Lake',d:'Still water mirrors the distant mountains.'},{x:3400,n:'Hidden Falls',d:'A waterfall tucked away in the green valley.'},{x:5100,n:'Mountain Village',d:'A small village resting above the clouds.'}];const found=new Set(Array.isArray(saved.found)?saved.found:[]);
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function rnd(n){let v=Math.sin(n*127.1+311.7)*43758.5453;return v-Math.floor(v)}
function hill(layer,color,base,amp,step){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,h);for(let x=0;x<=w+step;x+=step){let q=(x+world*layer)/step,i=Math.floor(q),f=q-i;let a=rnd(i+layer*101),b=rnd(i+1+layer*101);ctx.lineTo(x,base-(a*(1-f)+b*f)*amp)}ctx.lineTo(w,h);ctx.closePath();ctx.fill()}
function cloud(x,y,s){ctx.fillStyle='#ffffff90';ctx.beginPath();ctx.ellipse(x,y,36*s,13*s,0,0,7);ctx.ellipse(x+25*s,y-8*s,26*s,17*s,0,0,7);ctx.ellipse(x+50*s,y,31*s,12*s,0,0,7);ctx.fill()}
function tree(x,y,s,i){ctx.fillStyle='#654b38';ctx.fillRect(x-3*s,y-29*s,6*s,29*s);ctx.fillStyle=i%2?'#40795a':'#508b64';for(let k=0;k<3;k++){ctx.beginPath();ctx.moveTo(x,y-(76-k*18)*s);ctx.lineTo(x-(30-k*5)*s,y-(24-k*12)*s);ctx.lineTo(x+(30-k*5)*s,y-(24-k*12)*s);ctx.closePath();ctx.fill()}}
function draw(){let daylight=timeMode===1?1:timeMode===2?0:Math.max(0,Math.sin(time*Math.PI*2));let night=1-daylight;let sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,night>.5?'#14213d':'#70b8e4');sky.addColorStop(.6,night>.5?'#536b88':'#d7e9e3');sky.addColorStop(1,night>.5?'#a0a6b2':'#f4d8a8');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);
ctx.fillStyle=night>.5?'#f5f0d2':'#fff1c3';ctx.beginPath();ctx.arc(w*.78,h*(night>.5?.18:.2),Math.min(w,h)*.05,0,7);ctx.fill();
cloud((w*.12-world*.06)%(w+130),h*.18,.9);cloud((w*.55-world*.04)%(w+170),h*.24,.65);
hill(.10,night>.5?'#536780':'#a2c1cc',h*.54,h*.3,95);hill(.20,night>.5?'#40596d':'#779fa6',h*.63,h*.22,72);hill(.34,night>.5?'#294d52':'#5f8e73',h*.73,h*.12,55);
const gy=h*.77;ctx.fillStyle=night>.5?'#345b4b':'#89b47e';ctx.fillRect(0,gy,w,h-gy);
ctx.fillStyle=night>.5?'#827d70':'#d8c18f';ctx.beginPath();ctx.moveTo(0,h*.84);ctx.quadraticCurveTo(w*.38,h*.76,w*.62,h*.84);ctx.quadraticCurveTo(w*.82,h*.9,w,h*.82);ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();ctx.fill();
// lake
let lx=2700-world*.42;if(lx<w+360&&lx+620>0){ctx.fillStyle=night>.5?'#435e7b':'#83c3d0';ctx.beginPath();ctx.ellipse(lx+290,h*.75,310,38,0,0,7);ctx.fill();ctx.strokeStyle='#d8f1e9';ctx.lineWidth=2;for(let i=0;i<7;i++){ctx.beginPath();ctx.moveTo(lx+90+i*48,h*.75+(i%2)*5);ctx.lineTo(lx+135+i*48,h*.75+(i%2)*5);ctx.stroke()}}
// distant trees and flower details
for(let i=0;i<48;i++){let x=i*175+45-world*.52;if(x>-65&&x<w+65)tree(x,h*.79+rnd(i)*h*.055,.5+rnd(i+4)*.58,i)}
for(let i=0;i<90;i++){let x=i*91+30-world*.65;if(x>0&&x<w){ctx.fillStyle=['#fff0bd','#e8c3b0','#e6eee0'][i%3];ctx.fillRect(x,h*.86+rnd(i)*h*.08,3,3)}}
// marker
for(const p of points){let x=p.x-world+w*.34;if(x>25&&x<w-25){ctx.fillStyle='#fff2c4';ctx.beginPath();ctx.arc(x,h*.65,7,0,7);ctx.fill();ctx.fillStyle=night>.5?'#e5eadc':'#2e4d43';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText(p.n,x,h*.65-16)}}
// traveler
let px=w*.34,py=h*.78;ctx.fillStyle='#293f4a';ctx.fillRect(px-9,py-42,18,27);ctx.fillStyle='#d9b28b';ctx.beginPath();ctx.arc(px,py-49,8,0,7);ctx.fill();ctx.fillStyle='#354d59';ctx.beginPath();ctx.moveTo(px-10,py-56);ctx.lineTo(px+10,py-56);ctx.lineTo(px+6,py-66);ctx.lineTo(px-5,py-66);ctx.closePath();ctx.fill();ctx.strokeStyle='#293f4a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(px-5,py-15);ctx.lineTo(px-8,py);ctx.moveTo(px+5,py-15);ctx.lineTo(px+8,py);ctx.stroke();
if(night>.5){ctx.fillStyle='#d9e5ff12';ctx.fillRect(0,0,w,h)}
ctx.fillStyle='#ffffff55';ctx.fillRect(w/2-100,14,200,5);ctx.fillStyle='#fff2c0';ctx.fillRect(w/2-100,14,200*world/maxWorld,5);document.querySelector('#progress').style.width=(world/maxWorld*100)+'%';}
function saveGame(){try{localStorage.setItem('forgottenPathSave',JSON.stringify({world,found:[...found],time,timeMode}))}catch(e){document.querySelector('#saveStatus').textContent='อุปกรณ์นี้ไม่อนุญาตให้บันทึกอัตโนมัติ'}}
function renderJournal(){const list=document.querySelector('#journalList'),count=found.size;list.innerHTML='';for(const p of points){const ok=found.has(p.x),item=document.createElement('div');item.className='entry '+(ok?'':'locked');const title=document.createElement('strong');title.textContent=(ok?'✦ ':'○ ')+p.n;const desc=document.createElement('small');desc.textContent=ok?p.d:'ยังไม่ได้ค้นพบ';item.append(title,desc);list.appendChild(item)}document.querySelector('#mapFill').style.width=(world/maxWorld*100)+'%';document.querySelector('#mapText').textContent='เดินทางแล้ว '+Math.round(world/maxWorld*100)+'% • ค้นพบ '+count+'/'+points.length+' จุด';document.querySelector('#mapMarks').innerHTML=points.map(p=>'<i class="'+(found.has(p.x)?'found':'')+'" title="'+p.n+'"></i>').join('');document.querySelector('#saveStatus').textContent='บันทึกอัตโนมัติในอุปกรณ์นี้ • '+count+' จุดที่ค้นพบ'}
function discover(){let changed=false;for(const p of points){if(found.has(p.x)||Math.abs(world-p.x)>80)continue;found.add(p.x);changed=true;const el=document.querySelector('#discover');el.innerHTML='<strong>'+p.n+'</strong><br><small>'+p.d+'</small>';el.classList.add('show');setTimeout(()=>el.classList.remove('show'),4200)}if(changed){saveGame();renderJournal()}}
let photoMode=false;function togglePhoto(on){photoMode=on;document.body.classList.toggle('photo-mode',on);document.querySelector('#photoPanel').classList.toggle('open',on);keys.left=false;keys.right=false;saveGame()}function capturePhoto(){try{canvas.toBlob(blob=>{if(!blob){alert('ไม่สามารถสร้างภาพได้ ลองอีกครั้ง');return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='the-forgotten-path-view.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)},'image/png')}catch(e){alert('เบราว์เซอร์ไม่รองรับการบันทึกภาพนี้')}}
function frame(now){let dt=Math.min((now-last)/1000,.05);last=now;let speed=slow?85:165;if(!photoMode&&keys.right)world=Math.min(maxWorld,world+speed*dt);if(!photoMode&&keys.left)world=Math.max(0,world-speed*dt);if(!photoMode&&timeMode===0)time=(time+dt*.006)%1;discover();saveClock+=dt;if(saveClock>2){saveClock=0;saveGame()}draw();requestAnimationFrame(frame)}
function bind(id,k){let b=document.getElementById(id);const on=e=>{e.preventDefault();keys[k]=true};const off=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,off))}
bind('left','left');bind('right','right');document.querySelector('#slow').onclick=()=>{slow=!slow;document.querySelector('#slow').textContent=slow?'เดินปกติ':'เดินช้า'};document.querySelector('#time').onclick=()=>{timeMode=(timeMode+1)%3;document.querySelector('#time').textContent=['เวลา: ออโต้','เวลา: กลางวัน','เวลา: กลางคืน'][timeMode];saveGame()};document.querySelector('#photoBtn').onclick=()=>togglePhoto(true);document.querySelector('#capturePhoto').onclick=capturePhoto;document.querySelector('#exitPhoto').onclick=()=>togglePhoto(false);const journal=document.querySelector('#journal');document.querySelector('#journalBtn').onclick=()=>{renderJournal();journal.classList.add('open')};document.querySelector('#journalClose').onclick=()=>journal.classList.remove('open');journal.addEventListener('click',e=>{if(e.target===journal)journal.classList.remove('open')});renderJournal();addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=true;if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=true});addEventListener('keyup',e=>{if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false;if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false});requestAnimationFrame(frame)})();
</script>
</body>
</html>
